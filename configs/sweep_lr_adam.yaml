# One-factor-at-a-time sweep: lr_adam. Baseline = relu / adam / lr 1e-3 / bs 64 / 15 epochs.
program: train.py
method: grid
metric: {name: val_acc, goal: maximize}
parameters:
  epochs: {value: 15}
  activation: {value: relu}
  optimizer: {value: adam}
  batch_size: {value: 64}
  lr: {values: [0.0001, 0.0003, 0.001, 0.003]}
