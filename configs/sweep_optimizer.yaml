# One-factor-at-a-time sweep: optimizer. Baseline = relu / adam / lr 1e-3 / bs 64 / 15 epochs.
program: train.py
method: grid
metric: {name: val_acc, goal: maximize}
parameters:
  epochs: {value: 15}
  activation: {value: relu}
  batch_size: {value: 64}
  optimizer: {values: [sgd, nesterov, adam, adagrad, rmsprop, nadam]}
  lr: {values: [0.001, 0.01]}
